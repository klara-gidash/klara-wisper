# Klara Wisper Cloud gateway. This file holds no secrets.
# The access token is a Worker secret, set with: npx wrangler secret put KLARA_TOKEN
name = "klara-wisper-gateway"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
# No extra per-version preview hostnames for this Worker.
preview_urls = false

# Request logs would include the /mcp/<token> URL, so they stay off. `npx wrangler tail` still works for debugging.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "klara-wisper"
database_id = "REPLACE_WITH_YOUR_D1_ID"
