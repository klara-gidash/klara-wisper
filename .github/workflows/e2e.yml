# End-to-end simulations of a novice install, on GitHub's machines. Builds the real installers once
# per OS, then runs each scenario as its own job on a fresh machine. See scripts/ci/e2e/README.md.
#   W1 clean install + install wizard clicked like a novice (CDP), health incl. Claude
#   W2 full call: virtual audio, calendar .ics, fake zoom.exe, live Hebrew transcript, MCP, finish
#   W3 Hebrew Windows profile path (C:\Users\קלרה-בדיקה), health incl. Claude, MCP
#   W4 upgrade from v0.1.1 over a running app + an open MCP server
#   M1+M2 macOS pkg + wizard + health + Claude config + MCP
# Manual only: Actions -> "E2E simulations" -> Run workflow. No secrets; read-only token.
name: E2E simulations

on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Run the Windows scenarios'
        type: boolean
        default: true
      mac:
        description: 'Run the macOS scenario'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PLAYWRIGHT_CORE_VERSION: '1.49.1'
  FFMPEG_ZIP_URL: 'https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip'
  SOUNDDEVICE_VERSION: '0.5.1'
  NUMPY_VERSION: '2.1.3'
  VBCABLE_CHOCO_VERSION: '2.1.5.8'
  UPGRADE_FROM: 'v0.1.1'

jobs:
  build-windows:
    if: inputs.windows
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build the installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\make-windows.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-installer-windows
          path: release/Klara Wisper Setup.exe
          if-no-files-found: error
          retention-days: 3

  windows:
    name: windows ${{ matrix.scenario }}
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        scenario: [w1-wizard, w2-call, w3-hebrew-profile, w4-upgrade]
    env:
      E2E_OUT: ${{ github.workspace }}\e2e-out
      PW_DIR: ${{ runner.temp }}\pw
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: e2e-installer-windows
          path: installer
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tools (playwright-core for CDP)
        if: matrix.scenario == 'w1-wizard'
        shell: pwsh
        run: npm install --no-save --no-audit --no-fund --prefix "$env:PW_DIR" "playwright-core@$env:PLAYWRIGHT_CORE_VERSION"
      - name: Tools (ffmpeg as zoom.exe, sounddevice for playback)
        if: matrix.scenario == 'w2-call'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "sounddevice==$env:SOUNDDEVICE_VERSION" "numpy==$env:NUMPY_VERSION"
          $dir = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest -UseBasicParsing $env:FFMPEG_ZIP_URL -OutFile "$dir\ffmpeg.zip"
          Expand-Archive -Force "$dir\ffmpeg.zip" $dir
          $exe = (Get-ChildItem -Recurse -LiteralPath $dir -Filter ffmpeg.exe | Select-Object -First 1).FullName
          & $exe -hide_banner -version | Select-Object -First 1
          "FFMPEG_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Previous release (${{ env.UPGRADE_FROM }})
        if: matrix.scenario == 'w4-upgrade'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:UPGRADE_FROM --repo $env:GITHUB_REPOSITORY --pattern '*Setup*.exe' --dir old-installer --clobber
          $old = Get-ChildItem old-installer -Filter *.exe | Select-Object -First 1
          if (-not $old) { throw "no Setup .exe in release $env:UPGRADE_FROM" }
          "OLD_SETUP=$($old.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Scenario ${{ matrix.scenario }}
        shell: pwsh
        timeout-minutes: 100
        run: |
          $setup = (Resolve-Path 'installer\Klara Wisper Setup.exe').Path
          switch ('${{ matrix.scenario }}') {
            'w1-wizard'         { pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\ci\e2e\win-w1-wizard.ps1 -Setup $setup }
            'w2-call'           { pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\ci\e2e\win-w2-call.ps1 -Setup $setup }
            'w3-hebrew-profile' { pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\ci\e2e\win-w3-hebrew-profile.ps1 -Setup $setup }
            'w4-upgrade'        { pwsh -NoProfile -ExecutionPolicy Bypass -File scripts\ci\e2e\win-w4-upgrade.ps1 -OldSetup $env:OLD_SETUP -Setup $setup }
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-windows-${{ matrix.scenario }}
          path: e2e-out
          if-no-files-found: warn
          retention-days: 14

  build-mac:
    if: inputs.mac
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install packages
        run: npm ci
      - name: Build the pkg
        run: bash scripts/make-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: e2e-installer-mac
          path: release/Klara Wisper.pkg
          if-no-files-found: error
          retention-days: 3

  mac:
    name: mac M1+M2
    needs: build-mac
    runs-on: macos-15
    timeout-minutes: 120
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
      PW_DIR: ${{ runner.temp }}/pw
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: e2e-installer-mac
          path: installer
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tools (playwright-core for CDP)
        run: npm install --no-save --no-audit --no-fund --prefix "$PW_DIR" "playwright-core@$PLAYWRIGHT_CORE_VERSION"
      - name: Scenario M1+M2
        timeout-minutes: 100
        run: bash scripts/ci/e2e/mac-e2e.sh "installer/Klara Wisper.pkg"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-mac
          path: e2e-out
          if-no-files-found: warn
          retention-days: 14
