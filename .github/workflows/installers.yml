# Builds the installers on GitHub's machines and attaches them to a release:
#   macOS (Apple Silicon): release/Klara Wisper.dmg       (scripts/make-dmg.sh)
#   Windows 10/11 x64:     release/Klara Wisper Setup.exe (scripts/make-windows.ps1)
# Runs when a tag like v0.1.1 is pushed, or by hand: Actions → "Build installers" → Run workflow.
# No secrets are used: the builds are unsigned (ad-hoc on the Mac), see docs/INSTALL.he.md.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to attach the installers to (e.g. v0.1.0); empty = only keep them as workflow artifacts'
        required: false
        default: ''
      mac:
        description: 'Build the macOS dmg'
        type: boolean
        default: true
      windows:
        description: 'Build the Windows installer'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\make-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Klara-Wisper-Windows
          path: release/Klara Wisper Setup.exe
      - name: Attach to the release
        if: github.event_name == 'push' || inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release }}
        run: gh release upload "$env:TAG" "release/Klara Wisper Setup.exe" --clobber --repo "${{ github.repository }}"

  mac:
    if: github.event_name == 'push' || inputs.mac
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install packages
        run: npm ci
      - name: Build the dmg
        run: bash scripts/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Klara-Wisper-macOS
          path: release/Klara Wisper.dmg
      - name: Attach to the release
        if: github.event_name == 'push' || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release }}
        run: gh release upload "$TAG" "release/Klara Wisper.dmg" --clobber --repo "${{ github.repository }}"
