[project]
name = "klara-engine"
version = "0.1.0"
description = "Local transcription engine for Klara Wisper: Whisper (MLX on Mac, CTranslate2 on Windows), Silero VAD, Nemotron-3 diarization"
requires-python = ">=3.12,<3.13"
dependencies = [
  # ASR: MLX on Apple Silicon, CTranslate2 (faster-whisper) on Windows
  "mlx-whisper>=0.4.3; sys_platform == 'darwin'",
  "mlx>=0.32; sys_platform == 'darwin'",
  "faster-whisper>=1.2; sys_platform == 'win32'",
  "numpy>=2.0",
  "torch>=2.8",
  "transformers>=5.20",
  "silero-vad>=6.2",
  "speechbrain>=1.1",
  "websockets>=15",
  "huggingface-hub>=1.0",
  "soundfile>=0.13",
  "librosa>=0.11",
  "mcp>=1.20",
]

[dependency-groups]
dev = ["pytest>=8", "jiwer>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klara_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
